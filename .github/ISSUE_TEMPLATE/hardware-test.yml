name: Hardware test report
description: Report compatibility or a real-hardware test result (successes and failures welcome)
title: "[Hardware Test] "
labels: ["hardware-test"]
body:
  - type: markdown
    attributes:
      value: |
        **This project is experimental and has not been sufficiently validated.** Only submit results you personally observed. Redact MAC addresses, public IPs, serial numbers, and sensitive logs.
  - type: input
    id: os
    attributes:
      label: OS and release
      description: e.g., Debian 13, Ubuntu 26.04, Proxmox VE 9.2, or OpenWrt version
      placeholder: OS name and version
    validations:
      required: true
  - type: input
    id: kernel
    attributes:
      label: Kernel version
      placeholder: Output of uname -r
    validations:
      required: true
  - type: input
    id: nic
    attributes:
      label: NIC model, PCI ID, and OEM variant
      placeholder: e.g., X550-T2, 8086:1563, OEM model if known
    validations:
      required: true
  - type: input
    id: driver
    attributes:
      label: Driver and firmware/NVM version
      placeholder: ethtool -i output (redacted)
    validations:
      required: false
  - type: input
    id: peer
    attributes:
      label: Switch or peer device
      placeholder: Model and firmware version if known
    validations:
      required: false
  - type: dropdown
    id: result
    attributes:
      label: Test outcome
      options:
        - Worked in limited testing
        - Failed
        - Mixed / intermittent
        - Not yet applied (read-only status only)
    validations:
      required: true
  - type: textarea
    id: details
    attributes:
      label: Observed speeds and test details
      description: Include link modes, uptime, negotiation, reboot/hotplug behavior, errors, and exact steps.
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy check
      options:
        - label: I removed sensitive identifiers and credentials from this report.
          required: true
